# Render blueprint — Mihenk backend (Docker).
# RAM düzeni (Ağu 2026 refactor'u): korpus SQLite'ta (RAM'de değil), embedding q8
# ONNX + kompakt tokenizer, vektörler int8 → RSS ~250-350 MB. Standard (2 GB, $25)
# artık gerekmiyor; starter (512 MB, $7) yeterli.
services:
  - type: web
    name: mihenk-api
    runtime: docker
    plan: starter           # 8 Ağu 2026: free'den dönüldü ($7/ay). Üç sorunu birden çözüyor:
                            # (1) kota artık /veri diskinde kalıcı, (2) analitik olayları da
                            # kalıcı, (3) uyku yok → 32,8 sn'lik soğuk açılış bitti.
                            # RSS ~280 MB, 512 MB'a sığıyor (kod 440 MB'ta uyarıyor).
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: veri
      mountPath: /veri      # kota.mjs ve olay.mjs '/veri' varsa onu kullanır.
      sizeGB: 1
    #
    # KOTA: cihaz başına toplam ücretsiz sorgu sayacı /veri/kota/kullanim.jsonl'da.
    # Konteyner FS'ine yazıldığı sürece "toplam 5 sorgu" fiilen "her uyanışta 5"
    # oluyordu (ölçüm 7 Ağu: kota tüketildi → 45 dk uyku → kalan:5) ve paywall HİÇ
    # tetiklenmiyordu. Disk bunu kapatıyor. Supabase yolu (supabase-kota.sql) kodda
    # duruyor ama gerekmiyor: SUPABASE_URL girilmezse dosya yolu kullanılır.
    #
    # ANALİTİK (olay): artık /veri'de, uyku/deploy'da SIFIRLANMIYOR.
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render panelinden gir
      - key: APP_KEY
        sync: false          # hadis.html'deki APP_KEY ile aynı olmalı
      - key: MODEL
        value: claude-haiku-4-5
      # IP başına saatlik tavan. 120 idi ve MEŞRU kullanıcıyı kilitliyordu: TR ve
      # Endonezya'da mobil operatörler CGNAT kullanıyor, yüzlerce abone tek genel
      # IP'nin arkasından çıkıp birbirini 429'a düşürüyordu. Asıl fren artık cihaz
      # başına (CIHAZ_RATE_LIMIT) + cihaz başına toplam ücretsiz sorgu kotası.
      # (NORM_LIMIT/NORM_DILLER kaldırıldı: normalize kopyalar artık RAM'de değil,
      #  inşa anında SQLite'a yazılıyor; taramalar SQL LIKE ile C tarafında.)
      - key: RATE_LIMIT
        value: "3000"
      - key: CIHAZ_RATE_LIMIT
        value: "300"
      - key: FREE_LIMIT
        value: "5"
      # Ücretsiz kotanın KALICI deposu (Kahve Falı ile aynı Supabase projesi olabilir;
      # tablo adı çakışmasın diye "mihenk_" öneki var). Tanımlı değilse sunucu açılışta
      # uyarı basar ve kota yalnız bellekte tutulur → uyanışta sıfırlanır.
      # Şema: supabase-kota.sql (Supabase → SQL Editor'de bir kez çalıştır).
      - key: SUPABASE_URL
        sync: false          # https://xxxx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false          # service_role anahtarı (RLS'i aşar; istemciye ASLA verme)
      # Render'ın kenar proxy'si arkasındayız: istemci IP'si X-Forwarded-For'dan
      # okunur. Bu bayrak olmadan herkes tek kovada toplanır ve IP tavanına
      # takılınca TÜM kullanıcılar birden 429 yer.
      - key: PROXY_GUVENILIR
        value: "1"
      # RevenueCat GİZLİ anahtarı (sk_...). Premium'un TEK doğruluk kaynağı budur:
      # sunucuda kalıcı abone kaydı YOK, her cihazın durumu RevenueCat'ten sorulup
      # kısa süre önbelleklenir. Tanımlı değilse hiçbir cihaz premium olamaz.
      - key: RC_SECRET
        sync: false          # Render panelinden gir
      # (TEST_LISANS kaldırıldı: /api/lisans ucu silindi — IAP dışı kilit açma
      #  App Store 3.1.1 ihlali; değişkenin varlığı riski canlı tutuyordu.)
      # Anonim kullanım özeti ucu (/olcum?k=...) — tanımlı değilse uç 404 döner.
      - key: OLCUM_ANAHTAR
        generateValue: true
