# Render blueprint — Mihenk backend (Docker). Paralı tier: model + vektörler RAM ister.
services:
  - type: web
    name: mihenk-api
    runtime: docker
    plan: standard          # embedding modeli + vektörler için (starter'ın RAM'i yetmeyebilir)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render panelinden gir
      - key: APP_KEY
        sync: false          # hadis.html'deki APP_KEY ile aynı olmalı
      - key: MODEL
        value: claude-haiku-4-5
      - key: RATE_LIMIT
        value: "120"
      # Render'ın kenar proxy'si arkasındayız: istemci IP'si X-Forwarded-For'dan
      # okunur. Bu bayrak olmadan herkes tek kovada toplanıp 120 istek/saatte
      # TÜM kullanıcılar 429 yiyordu.
      - key: PROXY_GUVENILIR
        value: "1"
      # RevenueCat GİZLİ anahtarı (sk_...). Tanımlı değilse /api/iap-onay premium VERMEZ.
      - key: RC_SECRET
        sync: false          # Render panelinden gir
      # Test lisansı — tanımlı DEĞİLSE lisans akışı tamamen kapalıdır (üretimde böyle olmalı).
      - key: TEST_LISANS
        sync: false
